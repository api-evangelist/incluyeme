aid: incluyeme
name: Incluyeme
description: >-
  Incluyeme.com is a Latin American social enterprise, founded in 2013 by Gabriel
  Marcolongo, working toward the social and labor inclusion of people with disabilities.
  Its online platform connects candidates with disabilities to inclusive employers,
  offering job listings, virtual training courses, scholarships, and mentorship for
  individuals, alongside inclusive-hiring consulting, talent sourcing, staff training,
  and physical/web accessibility evaluation for companies. Operating across roughly
  a dozen countries in Latin America (Argentina, Chile, Peru, Colombia, Mexico,
  Uruguay, Paraguay and more), it has registered hundreds of thousands of people
  with disabilities and placed thousands into roles with 100+ corporate clients.
  Surfaced as a 500 Global portfolio company and profiled in the API Evangelist
  network; it publishes no public developer API.
